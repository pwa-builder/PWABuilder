name: Delete closed PR slots

on:
  # No path filter: cleanup must run even if a later commit removes the relevant changes.
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: pwabuilder
          - app_name: pwabuilder-windows-docker
          - app_name: pwabuilder-cloudapk
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    concurrency:
      group: pr-slot-${{ matrix.app_name }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment: staging
    steps:
      # Only execute the trusted default branch, never the PR head or merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Log in to Azure for PWABuilder
        if: matrix.app_name == 'pwabuilder'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_WESTUS3_APP_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to Azure for Microsoft Store
        if: matrix.app_name == 'pwabuilder-windows-docker'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_EASTUS_APP_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to Azure for Google Play
        if: matrix.app_name == 'pwabuilder-cloudapk'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CENTRALUS_APP_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete PR slot if present
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ matrix.app_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          & ./.github/scripts/manage-pr-slot.ps1 -Operation Delete `
            -AppName $env:APP_NAME -PullRequestNumber $env:PR_NUMBER `
            -Repository $env:GITHUB_REPOSITORY
