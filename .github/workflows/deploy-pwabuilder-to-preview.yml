name: Deploy PWABuilder web app to staging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/pwabuilder/**"
      - "Dockerfile.production"
      - ".github/workflows/deploy-pwabuilder-to-preview.yml"
  workflow_dispatch:

env:
  # ACR Configuration
  ACR_RESOURCE_GROUP: pwabuilder-registry
  ACR_NAME: pwabuilder
  IMAGE_TAG: pwabuilder.azurecr.io/pwabuilder:preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Web App Configuration
  WEB_APP_NAME: pwabuilder
  WEB_APP_RESOURCE_GROUP: pwabuilder-prod # Replace with your Web App's resource group
  WEB_APP_SLOT: preview # Deployment slot name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure with Managed Identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_WESTUS3_APP_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure docker registry (ACR)
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Docker info
        run: docker info

      - name: Docker build
        run: docker build . --file Dockerfile.production --tag "$IMAGE_TAG" -m 4GB

      - name: Docker push and capture immutable image reference
        id: pushed-image
        run: |
          docker push "$IMAGE_TAG"
          image_reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
          if [[ ! "$image_reference" =~ ^pwabuilder\.azurecr\.io/pwabuilder@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker did not return the expected pushed image digest."
            exit 1
          fi
          echo "image_reference=$image_reference" >> "$GITHUB_OUTPUT"

      - name: Restart Azure Web App Staging Slot
        env:
          IMAGE_REFERENCE: ${{ steps.pushed-image.outputs.image_reference }}
        run: |
          echo "🔄 Deploying $IMAGE_REFERENCE to the staging slot..."

          az webapp config container set \
            --name ${{ env.WEB_APP_NAME }} \
            --resource-group ${{ env.WEB_APP_RESOURCE_GROUP }} \
            --slot ${{ env.WEB_APP_SLOT }} \
            --docker-custom-image-name "$IMAGE_REFERENCE"

          # Restart the Web App staging slot
          az webapp restart --name ${{ env.WEB_APP_NAME }} --resource-group ${{ env.WEB_APP_RESOURCE_GROUP }} --slot ${{ env.WEB_APP_SLOT }}

          echo "✅ Web App staging slot restart completed"
