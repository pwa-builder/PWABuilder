# This GitHub Action workflow runs on checkin to main branch.
# It pushes a uniquely tagged image to the pwabuilder/cloudapk-prod repository in ACR.
# It then deploys that image by digest to the Azure Web App's staging slot.

name: Deploy Google Play packager to staging or PR slot

on:
  push:
    branches:
      - main
    paths:
      - "apps/pwabuilder-google-play/**"
      - ".github/workflows/deploy-google-play-to-preview.yml"
      - ".github/workflows/deploy-pr-slot.yml"
      - ".github/scripts/manage-pr-slot.ps1"
      - ".github/scripts/publish-pr-deployment-links.cjs"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/pwabuilder-google-play/**"
      - ".github/workflows/deploy-google-play-to-preview.yml"
      - ".github/workflows/deploy-pr-slot.yml"
      - ".github/scripts/manage-pr-slot.ps1"
      - ".github/scripts/publish-pr-deployment-links.cjs"
  workflow_dispatch: null

env:
  IMAGE_TAG: pwabuilder.azurecr.io/pwabuilder/cloudapk-prod:staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image_reference: ${{ steps.pushed-image.outputs.image_reference }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login with Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_WESTUS_APP_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure docker registry (ACR)
        run: az acr login --name pwabuilder

      - name: Docker build
        run: docker build -f apps/pwabuilder-google-play/Dockerfile apps/pwabuilder-google-play -t "$IMAGE_TAG"

      - name: Docker push and capture immutable image reference
        id: pushed-image
        run: |
          docker push "$IMAGE_TAG"
          image_reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
          if [[ ! "$image_reference" =~ ^pwabuilder\.azurecr\.io/pwabuilder/cloudapk-prod@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker did not return the expected pushed image digest."
            exit 1
          fi
          echo "image_reference=$image_reference" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build
    environment:
      name: staging
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Login with Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CENTRALUS_APP_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: pwabuilder-cloudapk
          slot-name: staging
          images: ${{ needs.build.outputs.image_reference }}

  deploy-pr:
    if: github.event_name == 'pull_request'
    needs: build
    permissions:
      contents: read
      pull-requests: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy-pr-slot.yml
    with:
      app_name: pwabuilder-cloudapk
      source_slot: staging
      image_reference: ${{ needs.build.outputs.image_reference }}
    secrets:
      azure_client_id: ${{ secrets.AZURE_CENTRALUS_APP_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
