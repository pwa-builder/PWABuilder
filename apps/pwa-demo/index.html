<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Nimbus — Offline-First Pocket Studio</title>

  <base href="/" />

  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Nimbus is an offline-first pocket studio PWA: capture notes, sketch ideas, snap photos, and explore what the modern web platform can do. Built with PWABuilder." />

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563eb" />

  <!-- Apple-specific tags: run full-screen when added to the Home Screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nimbus" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="Nimbus — Offline-First Pocket Studio" />
  <meta property="og:description" content="A PWA that showcases the modern web platform: offline, installable, and packed with device capabilities." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/screenshots/wide.png" />

  <!-- This tag is used by the PWA Starter CLI to identify template projects. -->
  <meta name="pwa-starter-template-identity" content="pwa-starter" />

  <link rel="icon" href="/assets/icons/icon_24.png" type="image/png" />

  <!-- A web app must have a manifest to be a PWA. -->
  <link rel="manifest" href="manifest.json" />

  <!-- Web Awesome global styles / theme. Preconnect for faster first paint;
       the service worker caches these at runtime so they work offline too. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.10.0/dist/styles/webawesome.css" />
  <link rel="stylesheet" href="global.css" />

  <!-- Web Awesome uses class-based color schemes. Track the OS preference. -->
  <script>
    (() => {
      const root = document.documentElement;
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const applyScheme = (isDark) => {
        root.classList.toggle('wa-dark', isDark);
        root.classList.toggle('wa-light', !isDark);
      };
      applyScheme(media.matches);
      media.addEventListener('change', (event) => applyScheme(event.matches));
    })();
  </script>

  <script type="module" src="/src/app-index.ts"></script>
</head>

<body>
  <app-index></app-index>

  <script>
    if ('serviceWorker' in navigator) {
      window.onload = () => {
        navigator.serviceWorker.register('/sw.js', { type: 'module' });
      };
    }
  </script>
</body>

</html>
