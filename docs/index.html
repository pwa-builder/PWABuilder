<!DOCTYPE html>
<html
  lang="en"
  class="wa-theme-shoelace wa-palette-shoelace wa-light"
>
  <head>
    <meta charset="UTF-8" />
    <title>PWABuilder Suite Documentation - test</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Documentation for building great progressive web apps with the PWABuilder tooling suite."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <meta property="og:image" content="/assets/icons/share-logo.png" />

    <!-- Google Site Verification for Google Search Console dashboard -->
    <meta
      name="google-site-verification"
      content="HPBaodfLBvVIFzKwWeIWMwaIwH_ArRkSG1xjWhpqhhg"
    />

    <link rel="icon" href="/assets/icons/icon_24.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0-rc.4/dist/themes/core.min.css"
      integrity="sha384-vZLEE3TRuDDm8ISALqe290W1CuaAdewPXIvNiZVfBqML6UtysOlyxWu2Qf2ylNGH"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/webawesome.css"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://ka-f.webawesome.com/webawesome@3.11.0/webawesome.loader.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/vs-prism.css" />
    <link rel="manifest" href="manifest.json" />
  </head>

  <body>
    <div id="app">
      <main id="main-content">
        <h1>PWABuilder Suite Documentation</h1>
        <p>Loading documentation...</p>
      </main>
    </div>

    <script
      type="text/javascript"
      src="https://js.monitor.azure.com/scripts/c/ms.analytics-web-3.min.js"
    ></script>

    <script type="module">
      import {
        recordPageView,
        recordPageAction,
      } from "./public/analytics/index.js";
      window.recordPageView = recordPageView;
      window.recordPageAction = recordPageAction;
    </script>

    <script>
      let pendingSidebarFocusRoute = null;

      function getPageName() {
        var pageName = "docs-home-about";
        try {
          var results = document.location.href.match("#\/[a-zA-Z\/-]+");
          var parsedSubURL = results[0];
          pageName =
            "docs" + parsedSubURL.replace("#", "").replaceAll("/", "-");
        } catch {
          console.warn(
            "Failed to parse page name at: " + document.location.href
          );
        }

        return pageName;
      }

      function updateSidebarSelection() {
        const treeItems = document.querySelectorAll(
          ".sidebar-tree wa-tree-item"
        );
        const currentRoute = getDocsifyRoute(document.location.hash);
        const matchingLinks = Array.from(
          document.querySelectorAll(".sidebar-tree a")
        ).filter(
          (link) =>
            getDocsifyRoute(
              new URL(link.href, document.location.origin).hash
            ) ===
            currentRoute
        );
        const selectedLink =
          matchingLinks.find(
            (link) =>
              link.closest("wa-tree-item")?.parentElement?.closest("wa-tree-item")
          ) || matchingLinks[0];
        const selectedItem = selectedLink?.closest("wa-tree-item");

        treeItems.forEach((item) => item.removeAttribute("selected"));
        selectedItem?.setAttribute("selected", "");
        selectedItem?.parentElement
          ?.closest("wa-tree-item")
          ?.setAttribute("expanded", "");
      }

      function getDocsifyRoute(hash) {
        return (hash || "#").split("?")[0];
      }

      function restoreSidebarFocus() {
        const focusRoute = pendingSidebarFocusRoute;
        pendingSidebarFocusRoute = null;

        if (focusRoute === getDocsifyRoute(document.location.hash)) {
          const selectedItem = document.querySelector(
            ".sidebar-tree wa-tree-item[selected]"
          );
          requestAnimationFrame(() => selectedItem?.focus());
        }
      }

      function wireSidebarSelectionNavigation() {
        const tree = document.querySelector(".sidebar-tree");

        tree?.addEventListener(
          "keydown",
          function (event) {
            if (event.key !== "Enter" && event.key !== " ") {
              return;
            }

            const focusedItem = document.activeElement;
            const focusedLink = focusedItem?.querySelector(":scope > a");
            if (focusedItem?.tagName === "WA-TREE-ITEM" && focusedLink) {
              pendingSidebarFocusRoute = getDocsifyRoute(
                new URL(focusedLink.href, document.location.origin).hash
              );
            }
          },
          true
        );

        tree?.addEventListener("wa-selection-change", function (event) {
          const selectedItem = event.detail.selection.at(-1);
          const selectedLink = selectedItem?.querySelector(":scope > a");

          if (!selectedLink) {
            return;
          }

          const destination = new URL(
            selectedLink.href,
            document.location.origin
          );
          if (
            getDocsifyRoute(destination.hash) !==
            getDocsifyRoute(document.location.hash)
          ) {
            document.location.hash = destination.hash;
          } else {
            pendingSidebarFocusRoute = null;
          }
        });
      }

      window.$docsify = {
        repo: "https://github.com/pwa-builder/PWABuilder",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        executeScript: true,
        externalLinkTarget: "_self",
        plugins: [
          // Send telemetry for page views.
          function (hook) {
            hook.doneEach(function () {
              window.recordPageView(document.location.href, getPageName());
            });
          },

          // Insert a banner about a new post.
          function (hook) {
            var summitBanner = [
              "<wa-callout>",
              '<wa-icon slot="icon" name="bookmark"></wa-icon>',
              "<div>",
              "<strong> New blog post! See how to enable in-app purchases on iOS in your PWA! </strong><br />",
              'Our latest post, <a href="https://blog.pwabuilder.com/posts/you-won\'t-believe-how-we-enabled-in-app-purchases-for-pwas-on-ios/"><b>You Won\’t Believe How We Enabled In-App Purchases for PWAs on iOS</b></a>, demonstrates what it takes to get iOS in-app purchases working on a Progressive Web App. Go check it out!',
              "</div>",
              "</wa-callout>",
            ].join("");

            hook.afterEach(function (html) {
              return summitBanner + html;
            });
          },
          function (hook) {
            // Rewrite the sidebar toggle button so it works with Windows narrator.
            hook.doneEach(function () {
              updateSidebarSelection();
              restoreSidebarFocus();
              wireSidebarSelectionNavigation();

              const mainElement = document.querySelector(
                'main[role="presentation"]'
              );
              if (mainElement) {
                mainElement.removeAttribute("role");
              }

              const sidebarToggleBtn =
                document.querySelector(".sidebar-toggle");
              if (sidebarToggleBtn) {
                sidebarToggleBtn.classList.add("sidebar-toggle-button");
                sidebarToggleBtn.removeAttribute("tabindex");
                sidebarToggleBtn.setAttribute(
                  "aria-label",
                  "Toggle primary navigation"
                );
                sidebarToggleBtn.removeAttribute("title", "");
                sidebarToggleBtn.setAttribute("aria-controls", "__sidebar");
                sidebarToggleBtn.setAttribute(
                  "aria-keyshortcuts",
                  "Control+\\"
                );
                sidebarToggleBtn.innerHTML = `<span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>`;
              }
            });
          },
        ],
      };
    </script>
    <!-- Docsify v4 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0-rc.4"
            integrity="sha384-+5qiV22wthYkGWRG6/fK4qabIAtdt0U4qWknDk+NBlrvGyMdh8V4q+OS7mhm57la"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/js/docsify-themeable.min.js"
            integrity="sha384-ibjVZCUwWPrRrNc9BNkbbJvtYmTh8GYDNQgj+2jQVNDudOFgSQWs+Es6JhdoTIvf"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0-rc.4/dist/plugins/search.min.js"
            integrity="sha384-9b8lF9DEkHJzsfkRG968tNHGLLWLUeTgDzCMvQNerzCB7GvJ8yD3oJ2GT3+p3tWW"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.0/dist/docsify-copy-code.min.js"
            integrity="sha384-Vu4LjJ210wltbg1I3zl1f5n8qLSDr9GE7ij2JfiMbV64UCFP2RgFtG8W2Gh6Khwe"
            crossorigin="anonymous"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/docsify-prism@latest/dist/docsify-prism.min.js "></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.17.1/plugins/autoloader/prism-autoloader.min.js "></script> -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1.6.0"
            integrity="sha384-iJhSf3CwRUo5dCBu4jN9tu5w/FWpCaXVjNmH8+8vkRbGdzIex5XxVKroIh+I58gn"
            crossorigin="anonymous"></script>
    <script>
      if (typeof navigator.serviceWorker !== "undefined") {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const githubCorner = document.querySelector(".github-corner");
        if (githubCorner) {
          githubCorner.setAttribute("title", "View source on GitHub");
        }
      });
    </script>
  </body>
</html>
